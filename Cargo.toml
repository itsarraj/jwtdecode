[package]
name = "jwtdecode"
version = "0.1.0"
edition = "2021"
description = "A standalone CLI to instantly decode and inspect JSON Web Tokens (JWTs)"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/jwtdecode"
readme = "README.md"
keywords = ["jwt", "decode", "cli", "security"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "2"
serde_json = "1"
base64 = "0.22"
